<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統一獅會員購買明細分析報告 (37年上)</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #263348;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #f97316; /* Lions Orange */
            --pos: #22c55e;
            --neg: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            font-weight: 800;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .stat-label {
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 32px 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
        }
        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            background: var(--surface2);
            padding: 12px 16px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .num { text-align: right; font-family: 'JetBrains Mono', monospace; }
        .highlight { color: var(--accent); font-weight: 700; }
        .rank {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: var(--surface2);
            text-align: center;
            line-height: 24px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-right: 8px;
        }
        .rank-1 { background: var(--accent); color: #000; }
        footer {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<header>
    <h1>🦁 統一獅會員購買明細分析</h1>
    <span style="color:var(--muted)">中華職棒37年例行賽 (上)</span>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">總成交筆數</div>
            <div class="stat-value">9,411</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">總成交張數</div>
            <div class="stat-value">9,412</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">最高單分鐘筆數</div>
            <div class="stat-value" style="color:var(--pos)">2,271</div>
            <div style="font-size:0.8rem;color:var(--muted);margin-top:4px">2026-03-29 16:05</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">資料區間</div>
            <div class="stat-value" style="font-size:1.2rem">2026/03 – 2026/06</div>
        </div>
    </div>

    <div class="section-title">巔峰時段排行 (前 20 繁忙分鐘)</div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>時間區間 (分鐘)</th>
                    <th class="num">成交筆數</th>
                    <th class="num">成交張數</th>
                    <th>佔比估算</th>
                </tr>
            </thead>
            <tbody id="minute-body"></tbody>
        </table>
    </div>

    <div class="section-title">每小時趨勢統計</div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>日期時段</th>
                    <th class="num">成交筆數</th>
                    <th class="num">成交張數</th>
                </tr>
            </thead>
            <tbody id="hourly-body"></tbody>
        </table>
    </div>
</div>

<footer>
    報告產出時間：2026-04-10 | 基於《會員購買明細.xls》原始資料分析
</footer>

<script>
const hourlyData = [{"Hour":"2026-03-29 16:00","筆數":2271,"張數":2272},{"Hour":"2026-03-31 18:00","筆數":136,"張數":136},{"Hour":"2026-04-01 18:00","筆數":188,"張數":188},{"Hour":"2026-04-10 18:00","筆數":156,"張數":156},{"Hour":"2026-04-11 16:00","筆數":437,"張數":437},{"Hour":"2026-04-12 16:00","筆數":216,"張數":216},{"Hour":"2026-04-21 18:00","筆數":110,"張數":110},{"Hour":"2026-04-22 18:00","筆數":152,"張數":152},{"Hour":"2026-04-24 18:00","筆數":347,"張數":347},{"Hour":"2026-04-25 16:00","筆數":788,"張數":788},{"Hour":"2026-04-26 16:00","筆數":542,"張數":542},{"Hour":"2026-05-01 16:00","筆數":468,"張數":468},{"Hour":"2026-05-02 16:00","筆數":461,"張數":461},{"Hour":"2026-05-03 16:00","筆數":269,"張數":269},{"Hour":"2026-05-12 18:00","筆數":69,"張數":69},{"Hour":"2026-05-13 18:00","筆數":120,"張數":120},{"Hour":"2026-05-15 18:00","筆數":167,"張數":167},{"Hour":"2026-05-16 16:00","筆數":932,"張數":932},{"Hour":"2026-05-17 16:00","筆數":625,"張數":625},{"Hour":"2026-06-16 18:00","筆數":81,"張數":81},{"Hour":"2026-06-18 18:00","筆數":110,"張數":110},{"Hour":"2026-06-19 16:00","筆數":355,"張數":355},{"Hour":"2026-06-20 16:00","筆數":629,"張數":629},{"Hour":"2026-06-21 16:00","筆數":360,"張數":360}];
const minuteData = [{"Minute":"2026-03-29 16:05","筆數":2271,"張數":2272},{"Minute":"2026-05-16 16:05","筆數":932,"張數":932},{"Minute":"2026-04-25 16:05","筆數":788,"張數":788},{"Minute":"2026-06-20 16:05","筆數":629,"張數":629},{"Minute":"2026-05-17 16:05","筆數":625,"張數":625},{"Minute":"2026-04-26 16:05","筆數":542,"張數":542},{"Minute":"2026-05-01 16:05","筆數":468,"張數":468},{"Minute":"2026-05-02 16:05","筆數":461,"張數":461},{"Minute":"2026-04-11 16:05","筆數":437,"張數":437},{"Minute":"2026-06-21 16:05","筆數":360,"張數":360},{"Minute":"2026-06-19 16:05","筆數":355,"張數":355},{"Minute":"2026-04-24 18:35","筆數":347,"張數":347},{"Minute":"2026-05-03 16:05","筆數":269,"張數":269},{"Minute":"2026-04-12 16:05","筆數":216,"張數":216},{"Minute":"2026-04-01 18:35","筆數":188,"張數":188},{"Minute":"2026-05-15 18:35","筆數":167,"張數":167},{"Minute":"2026-04-10 18:35","筆數":156,"張數":156},{"Minute":"2026-04-22 18:35","筆數":152,"張數":152},{"Minute":"2026-03-31 18:35","筆數":136,"張數":136},{"Minute":"2026-05-13 18:35","筆數":120,"張數":120}];

const fmt = n => n.toLocaleString();

document.getElementById('minute-body').innerHTML = minuteData.map((d, i) => `
    <tr>
        <td><span class="rank ${i===0?'rank-1':''}">${i+1}</span></td>
        <td class="highlight">${d.Minute}</td>
        <td class="num">${fmt(d.筆數)}</td>
        <td class="num">${fmt(d.張數)}</td>
        <td><div style="width:${(d.筆數/2271*100).toFixed(0)}%; height:8px; background:var(--accent); border-radius:4px;"></div></td>
    </tr>
`).join('');

document.getElementById('hourly-body').innerHTML = hourlyData.sort((a,b) => b.Hour.localeCompare(a.Hour)).map(d => `
    <tr>
        <td>${d.Hour}</td>
        <td class="num highlight">${fmt(d.筆數)}</td>
        <td class="num">${fmt(d.張數)}</td>
    </tr>
`).join('');
</script>

</body>
</html>
