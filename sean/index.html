<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣餐飲業智慧選址系統</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard">
        <!-- 左側面板：篩選條件 -->
        <aside class="sidebar">
            <h2>🌍 智慧選址條件</h2>
            
            <div class="form-group">
                <label for="city">目標城市</label>
                <select id="city">
                    <option value="taipei">台北市</option>
                    <option value="new_taipei">新北市</option>
                    <option value="taichung">台中市</option>
                    <option value="kaohsiung">高雄市</option>
                </select>
            </div>

            <div class="form-group">
                <label for="district">行政區</label>
                <select id="district">
                    <option value="daan">大安區</option>
                    <option value="xinyi">信義區</option>
                    <option value="zhongshan">中山區</option>
                </select>
            </div>

            <div class="form-group">
                <label for="restaurant-type">餐飲類型</label>
                <select id="restaurant-type">
                    <option value="cafe">咖啡廳 / 輕食</option>
                    <option value="fastfood">速食 / 小吃</option>
                    <option value="finedining">高價位餐廳</option>
                    <option value="izakaya">居酒屋 / 酒吧</option>
                </select>
            </div>

            <div class="form-group">
                <label for="budget">每月租金預算 (萬)</label>
                <input type="range" id="budget" min="5" max="50" value="15" step="1">
                <span id="budget-value">15 萬</span>
            </div>

            <button id="analyze-btn" class="primary-btn">開始綜合分析</button>

            <!-- 綜合評分結果區塊 -->
            <div class="score-card" id="score-card" style="display: none;">
                <h3>綜合選址評分</h3>
                <div class="score-value" id="final-score">85</div>
                <p>📍 建議：此區域年輕客群多，適合開設該類型餐廳，但競爭強度偏高。</p>
            </div>
        </aside>

        <!-- 中間區域：地圖 -->
        <main class="map-container">
            <div id="map"></div>
        </main>

        <!-- 右側面板：數據分析 -->
        <aside class="analytics-panel">
            <h2>📊 區域數據分析</h2>
            
            <div class="chart-container">
                <canvas id="populationChart"></canvas>
            </div>

            <div class="chart-container">
                <canvas id="competitorChart"></canvas>
            </div>

            <div class="info-card">
                <h4>周邊設施指標</h4>
                <ul class="facility-list">
                    <li>捷運站：<strong id="mrt-count">3</strong> 站</li>
                    <li>辦公大樓：<strong id="office-count">12</strong> 棟</li>
                    <li>學校：<strong id="school-count">2</strong> 所</li>
                </ul>
            </div>
        </aside>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
