
    <!DOCTYPE html>
    <html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <title>統一獅 3/9 18:00 訂單與張數 深度分析</title>
        <style>
            :root { --bg: #0f172a; --surface: #1e293b; --surface2: #263348; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #f97316; }
            body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; font-size: 14px; }
            header { background: var(--surface); padding: 24px 40px; border-bottom: 1px solid var(--border); }
            h1 { color: var(--accent); margin: 0; font-size: 1.6rem; font-weight: 800; }
            .container { max-width: 1400px; margin: 0 auto; padding: 32px; }
            .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
            .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
            .card-title { font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
            .stat-value { font-size: 2.2rem; font-weight: 800; color: #fff; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th { text-align: left; padding: 12px; font-size: 0.75rem; color: var(--muted); background: var(--surface2); }
            td { padding: 12px; border-bottom: 1px solid var(--border); }
            .num { text-align: right; font-family: monospace; font-size: 1.1em; }
            .highlight { color: var(--accent); font-weight: 700; }
        </style>
    </head>
    <body>
    <header>
        <h1>🦁 統一獅 3/9 開賣數據分析報告 (18:00-19:00)</h1>
        <div style="color:var(--muted); margin-top:4px">分析時段：開賣首小時</div>
    </header>
    <div class="container">
        <div class="stats-grid">
            <div class="card" style="border-left: 4px solid var(--accent)">
                <div class="card-title">總訂單筆數 (Unique Orders)</div>
                <div class="stat-value">7,831</div>
            </div>
            <div class="card">
                <div class="card-title">總成交張數 (Total Tickets)</div>
                <div class="stat-value">18,030</div>
            </div>
            <div class="card">
                <div class="card-title">參與認證資料一數量</div>
                <div class="stat-value">2,755</div>
            </div>
            <div class="card">
                <div class="card-title">巔峰成交分鐘</div>
                <div class="stat-value" style="color:var(--accent)">18:09</div>
                <div style="font-size:0.8rem; color:var(--muted); margin-top:4px">該分鐘成交 532 筆訂單</div>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 32px;">
            <div class="card">
                <div class="card-title">⏱️ 每分鐘成交對照 (訂單 vs 張數)</div>
                <table id="timeline-table"></table>
            </div>
            <div>
                <div class="card" style="margin-bottom:24px">
                    <div class="card-title">📦 單筆購買張數分佈</div>
                    <table id="qty-table"></table>
                </div>
                <div class="card">
                    <div class="card-title">🏆 活躍認證資料一排名 (依訂單筆數)</div>
                    <table id="heavy-table"></table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const timeline = [{"Minute":"18:08","Orders":283,"TicketsCount":697},{"Minute":"18:09","Orders":532,"TicketsCount":1343},{"Minute":"18:10","Orders":487,"TicketsCount":1262},{"Minute":"18:11","Orders":507,"TicketsCount":1273},{"Minute":"18:12","Orders":464,"TicketsCount":1139},{"Minute":"18:13","Orders":463,"TicketsCount":1126},{"Minute":"18:14","Orders":416,"TicketsCount":979},{"Minute":"18:15","Orders":381,"TicketsCount":846},{"Minute":"18:16","Orders":329,"TicketsCount":784},{"Minute":"18:17","Orders":338,"TicketsCount":799},{"Minute":"18:18","Orders":251,"TicketsCount":569},{"Minute":"18:19","Orders":254,"TicketsCount":552},{"Minute":"18:20","Orders":248,"TicketsCount":562},{"Minute":"18:21","Orders":219,"TicketsCount":495},{"Minute":"18:22","Orders":179,"TicketsCount":382},{"Minute":"18:23","Orders":177,"TicketsCount":377},{"Minute":"18:24","Orders":162,"TicketsCount":357},{"Minute":"18:25","Orders":172,"TicketsCount":355},{"Minute":"18:26","Orders":156,"TicketsCount":339},{"Minute":"18:27","Orders":128,"TicketsCount":264},{"Minute":"18:28","Orders":115,"TicketsCount":259},{"Minute":"18:29","Orders":112,"TicketsCount":251},{"Minute":"18:30","Orders":108,"TicketsCount":219},{"Minute":"18:31","Orders":93,"TicketsCount":202},{"Minute":"18:32","Orders":89,"TicketsCount":164},{"Minute":"18:33","Orders":96,"TicketsCount":199},{"Minute":"18:34","Orders":70,"TicketsCount":134},{"Minute":"18:35","Orders":72,"TicketsCount":151},{"Minute":"18:36","Orders":71,"TicketsCount":141},{"Minute":"18:37","Orders":74,"TicketsCount":157},{"Minute":"18:38","Orders":74,"TicketsCount":167},{"Minute":"18:39","Orders":66,"TicketsCount":149},{"Minute":"18:40","Orders":51,"TicketsCount":106},{"Minute":"18:41","Orders":58,"TicketsCount":128},{"Minute":"18:42","Orders":47,"TicketsCount":92},{"Minute":"18:43","Orders":47,"TicketsCount":92},{"Minute":"18:44","Orders":46,"TicketsCount":104},{"Minute":"18:45","Orders":35,"TicketsCount":78},{"Minute":"18:46","Orders":31,"TicketsCount":59},         // Render Timeline
        let timeHtml = '<thead><tr><th>時段</th><th class="num">訂單筆數</th><th class="num">張數</th></tr></thead><tbody>';
        timeline.forEach(d => {
            timeHtml += `<tr><td class="highlight">${d.Minute}</td><td class="num highlight">${d.Orders.toLocaleString()}</td><td class="num">${d.TicketsCount.toLocaleString()}</td></tr>`;
        });
        document.getElementById('timeline-table').innerHTML = timeHtml + '</tbody>';

        // Render Qty
        let qtyHtml = '<thead><tr><th>單筆購買張數</th><th class="num">訂單筆數</th></tr></thead><tbody>';
        for(let q in qtyDist) {
            qtyHtml += `<tr><td class="highlight">${q} 張</td><td class="num">${qtyDist[q].toLocaleString()}</td></tr>`;
        }
        document.getElementById('qty-table').innerHTML = qtyHtml + '</tbody>';

        // Render Heavy
        let heavyHtml = '<thead><tr><th>認證資料一</th><th class="num">訂單筆數</th></tr></thead><tbody>';
        heavy.forEach(d => {
            heavyHtml += `<tr><td class="highlight">${d.MemberNo}</td><td class="num highlight">${d.OrderCount.toLocaleString()}</td></tr>`;
        });
        document.getElementById('heavy-table').innerHTML = heavyHtml + '</tbody>';
    </script>
    </body>
    </html>
