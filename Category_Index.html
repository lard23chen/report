<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報表分類索引 - 2026/3/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-primary: #1a365d;
            --text-secondary: #2d3748;
            --accent-color: #3182ce;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        body { 
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            margin: 0; 
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            max-width: 900px; 
            width: 100%;
        }
        header { 
            text-align: center;
            margin-bottom: 50px; 
        }
        h1 { 
            margin: 0; 
            font-weight: 600; 
            color: var(--text-primary);
            font-size: 2.5rem;
            letter-spacing: -0.025em;
        }
        .subtitle {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 1.1rem;
            opacity: 0.8;
        }
        .category-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; 
        }
        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 30px; 
            box-shadow: var(--shadow); 
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: var(--accent-color);
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .card h2 { 
            margin: 0 0 15px 0; 
            font-size: 1.5rem; 
            color: var(--accent-color); 
        }
        .card p { 
            margin: 0;
            font-size: 1rem; 
            color: var(--text-secondary); 
            line-height: 1.6;
        }
        .footer {
            margin-top: 60px;
            text-align: center;
            font-size: 0.9rem;
            color: #718096;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>報表分類索引</h1>
        <div class="subtitle">分析報表與投資組合管理系統</div>
    </header>

    <div class="category-grid">
        <a href="Stock_Portfolio.html" class="card">
            <div class="icon">📈</div>
            <h2>股票投資組合</h2>
            <p>即時追蹤市場表現、資產配置分析與獲利統計報表。</p>
        </a>

        <a href="Travel_Tickets_2026.html" class="card">
            <div class="icon">🎫</div>
            <h2>2026 旅遊票券統計</h2>
            <p>詳細記錄 2026 年旅遊活動之票券銷售、營收與退票分析。</p>
        </a>
    </div>

    <div class="footer">
        最後更新時間: 2026/3/27 | 自動產出系統
    </div>
</div>
</body>
</html>
