<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報表分類索引 - 2026/3/27</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-primary: #1a365d;
            --text-secondary: #2d3748;
            --accent-color: #3182ce;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        body {
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            margin: 0;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 2.5rem;
            letter-spacing: -0.025em;
        }
        .subtitle {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 1.1rem;
            opacity: 0.8;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: var(--accent-color);
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .card h2 {
            margin: 0 0 15px 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }
        .card p {
            margin: 0;
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .footer {
            margin-top: 60px;
            text-align: center;
            font-size: 0.9rem;
            color: #718096;
        }

        /* Modal overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #fff;
            border-radius: 20px;
            padding: 36px 32px 28px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal .lock-icon { font-size: 2.8rem; margin-bottom: 12px; }
        .modal h2 {
            margin: 0 0 6px;
            font-size: 1.3rem;
            color: var(--text-primary);
        }
        .modal .hint {
            font-size: 0.85rem;
            color: #718096;
            margin-bottom: 22px;
        }
        .modal input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            color: var(--text-primary);
        }
        .modal input[type="password"]:focus { border-color: var(--accent-color); }
        .modal input[type="password"].error { border-color: #e53e3e; animation: shake 0.3s; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .error-msg {
            color: #e53e3e;
            font-size: 0.82rem;
            margin-top: 8px;
            min-height: 18px;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-cancel {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #f7fafc;
            color: #718096;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-cancel:hover { background: #edf2f7; }
        .btn-enter {
            flex: 2;
            padding: 11px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-enter:hover { background: #2b6cb0; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>報表分類索引</h1>
        <div class="subtitle">分析報表與投資組合管理系統</div>
    </header>

    <div class="category-grid">
        <div class="card" onclick="promptPassword('Stock_Portfolio.html')">
            <div class="icon">📈</div>
            <h2>股票投資組合</h2>
            <p>即時追蹤市場表現、資產配置分析與獲利統計報表。</p>
        </div>

        <div class="card" onclick="promptPassword('Travel_Tickets_2026.html')">
            <div class="icon">🎫</div>
            <h2>2026 旅遊票券統計</h2>
            <p>詳細記錄 2026 年旅遊活動之票券銷售、營收與退票分析。</p>
        </div>

        <div class="card" onclick="promptPassword('Team_Resources.html')">
            <div class="icon">📋</div>
            <h2>團隊資源索引</h2>
            <p>數位應用開發 Team 常用連結管理，支援新增、修改、刪除。</p>
        </div>
    </div>

    <div class="footer">
        最後更新時間: 2026/3/27 | 自動產出系統
    </div>
</div>

<!-- Password Modal -->
<div class="modal-overlay" id="pwdOverlay">
    <div class="modal">
        <div class="lock-icon">🔒</div>
        <h2>請輸入密碼</h2>
        <div class="hint">輸入密碼以進入此分類</div>
        <input type="password" id="pwdInput" placeholder="••••••••••" maxlength="20"
               oninput="clearError()" onkeydown="if(event.key==='Enter') checkPassword()">
        <div class="error-msg" id="errorMsg"></div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-enter" onclick="checkPassword()">進入</button>
        </div>
    </div>
</div>

<script>
const _p = atob('MDkxODIxNjAwMQ==');
let _target = '';

function promptPassword(url) {
    _target = url;
    const overlay = document.getElementById('pwdOverlay');
    const input = document.getElementById('pwdInput');
    input.value = '';
    document.getElementById('errorMsg').textContent = '';
    input.classList.remove('error');
    overlay.classList.add('open');
    setTimeout(() => input.focus(), 80);
}

function closeModal() {
    document.getElementById('pwdOverlay').classList.remove('open');
    _target = '';
}

function clearError() {
    document.getElementById('pwdInput').classList.remove('error');
    document.getElementById('errorMsg').textContent = '';
}

function checkPassword() {
    const val = document.getElementById('pwdInput').value;
    if (val === _p) {
        const dest = _target;
        closeModal();
        window.location.href = dest;
    } else {
        const input = document.getElementById('pwdInput');
        input.classList.add('error');
        document.getElementById('errorMsg').textContent = '密碼錯誤，請再試一次';
        input.value = '';
        setTimeout(() => input.classList.remove('error'), 400);
    }
}

document.getElementById('pwdOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('pwdOverlay')) closeModal();
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
