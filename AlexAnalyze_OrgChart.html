<!DOCTYPE html>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: #333;
      --text: #e0e0e0;
      --muted: #a0a0a0;
      --accent: #42A5F5;
      --purple: #9c27b0;
      --gold: #ffd700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 20px;
    }

    .back-btn {
      display: inline-block;
      padding: 8px 20px;
      background: #1e293b;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .back-btn:hover { background: var(--accent); color: #fff; }

    h1 {
      font-size: 2rem;
      color: var(--purple);
    }

    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tab-btn.active {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
      font-weight: 700;
    }

    /* ── Chart panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 16px rgba(0,0,0,.3);
    }

    .chart-card h2 {
      font-size: 1.1rem;
      color: var(--gold);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    /* Override Google OrgChart default white bg */
    .chart-wrap {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
    }

    .note {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 12px;
    }
    .note span { color: #ef9a9a; }
  </style>
</head>
