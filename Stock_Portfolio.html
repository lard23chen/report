    <!-- Password Protection -->
    <style>
        #pw-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: #0a0a0a;
            display: flex; align-items: center; justify-content: center;
        }
        #pw-box {
            text-align: center;
            font-family: 'Outfit', sans-serif;
            padding: 48px 40px;
            background: #1e1e1e;
            border-radius: 16px;
            border: 1px solid #333;
            min-width: 320px;
        }
        #pw-box .icon { font-size: 4rem; margin-bottom: 16px; }
        #pw-box h2 { color: #9c27b0; margin: 0 0 8px; font-size: 1.6rem; }
        #pw-box p  { color: #94a3b8; margin: 0 0 24px; font-size: 0.9rem; }
        #pw-input {
            width: 100%; box-sizing: border-box;
            padding: 12px 16px; font-size: 1.1rem;
            background: #121212; color: #e0e0e0;
            border: 2px solid #444; border-radius: 8px;
            outline: none; letter-spacing: 0.15em;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }
        #pw-input:focus { border-color: #9c27b0; }
        #pw-input.shake {
            animation: shake 0.35s ease;
            border-color: #ef4444;
        }
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            20%{transform:translateX(-8px)}
            40%{transform:translateX(8px)}
            60%{transform:translateX(-6px)}
            80%{transform:translateX(6px)}
        }
        #pw-btn {
            width: 100%; padding: 12px;
            background: #9c27b0; color: #fff;
            border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background 0.2s;
        }
        #pw-btn:hover { background: #7b1fa2; }
        #pw-err { color: #ef4444; font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
    </style>
    <script>
        (function () {
            var KEY = 'alex_life_auth';
            function unlock() {
                var el = document.getElementById('pw-overlay');
                if (el) el.remove();
            }
            function verify(pw) {
                return pw === atob('MDkxODIxNjAwMQ==');
            }
            function trySubmit() {
                var pw = document.getElementById('pw-input').value;
                if (verify(pw)) {
                    sessionStorage.setItem(KEY, '1');
                    unlock();
                } else {
                    var inp = document.getElementById('pw-input');
                    inp.classList.remove('shake');
                    void inp.offsetWidth;
                    inp.classList.add('shake');
                    document.getElementById('pw-err').textContent = '密碼錯誤，請再試一次';
                    inp.value = '';
                    inp.focus();
                }
            }
            document.addEventListener('DOMContentLoaded', function () {
                if (sessionStorage.getItem(KEY) === '1') { unlock(); return; }
                document.getElementById('pw-input').addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') trySubmit();
                });
                document.getElementById('pw-btn').addEventListener('click', trySubmit);
                document.getElementById('pw-input').focus();
            });
        })();
    </script>
<style>

<script>
const API_BASE = 'https://report-theta-nine.vercel.app/api/stock';
var data=[];

function yahooUrl(code){
  if(!code)return'#';
  var c=code.toString().trim();
  var first=parseInt(c.charAt(0));
  var suffix=(first===3||first===4)?'.TWO':'.TW';
  return'https://tw.stock.yahoo.com/quote/'+c+suffix;
}

function googleFinanceUrl(code){
  if(!code)return'#';
  var c=code.toString().trim();
  var first=parseInt(c.charAt(0));
  var exchange=(first===3||first===4)?'TPEX':'TPE';
  return'https://www.google.com/finance/quote/'+c+':'+exchange;
}

function fmt(n){if(!n&&n!==0)return'—';return Number(n).toLocaleString('en-US')}
function fmtP(n){if(!n&&n!==0)return'—';return Number(n).toFixed(2)}

function formatDate(val){
    if(!val) return '—';
    try {
        var s = val.toString();
        // If it's a full Date string (like Wed Mar 31...), extract the date parts
        if (s.includes(' ')) {
            // Try to parse it
            var d = new Date(val);
            if (!isNaN(d.getTime())) {
                var y = d.getFullYear();
                var m = (d.getMonth() + 1).toString().padStart(2, '0');
                var day = d.getDate().toString().padStart(2, '0');
                return y + '/' + m + '/' + day;
            }
        }
        // Handle ISO or YYYY-MM-DD or YYYY/MM/DD
        var datePart = s.split('T')[0].split(' ')[0].replace(/-/g, '/');
        var parts = datePart.split('/');
        if (parts.length >= 3) {
            return parts[0] + '/' + parts[1].padStart(2, '0') + '/' + parts[2].padStart(2, '0');
        }
        return datePart;
    } catch(e) { return val; }
}

async function fetchData(){
  setSyncState('loading','載入中…');
  try{
    var res=await fetch(API_BASE + '?t=' + Date.now());
    var json=await res.json();
    if(!json.ok)throw new Error('API error');
    data = json.data;
    setSyncState('ok','同步完成 (Cloud)・'+new Date().toLocaleTimeString('zh-TW',{hour12:false}));
    populateFilters(data);
    render();
  }catch(e){
    setSyncState('error','載入失敗');
    document.getElementById('hdr-sub').innerHTML = '<span style="color:#f87171;font-weight:bold">❌ 雲端 API 連線失敗，請檢查 Vercel 部署狀態</span>';
    console.error(e);
  }
}

async function apiPost(endpoint, body){
    const res = await fetch(API_BASE + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    return await res.json();
}

function setSyncState(state,text){
  var dot=document.getElementById('sync-dot');
  if(state==='loading'){dot.style.background='#f59e0b';dot.style.animation='pulse 1s infinite';}
  else if(state==='ok'){dot.style.background='#22c55e';dot.style.animation='none';}
  else{dot.style.background='#ef4444';dot.style.animation='none';}
  document.getElementById('sync-text').textContent=text;
}

var sortCol='date', sortDir='desc', curPage=1, perPage=50, editOn=false, activePerson='';
const PKEY='stock_prices';
function getPrices(){try{return JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){return{}}}
window.savePrice=function(code,val){var p=getPrices();p[code]=parseFloat(val)||0;localStorage.setItem(PKEY,JSON.stringify(p));render();};

window.fetchPrices=async function(){
    var btn=document.getElementById('fetch-prices-btn');
    if (!data || data.length === 0) {
        alert('請先等待資料載入完成');
        return;
    }
    var orig=btn.textContent;
    btn.textContent='⏳ 查詢中…'; btn.disabled=true;
    try {
        // Sanitize codes: remove duplicates, nulls, and trim spaces
        var codes = Array.from(new Set(data.map(r => r.code ? r.code.toString().trim() : ''))).filter(c => c && c.length >= 2);
        if (codes.length === 0) {
            btn.textContent = '無有效代號';
            setTimeout(() => { btn.textContent=orig; btn.disabled=false; }, 2000);
            return;
        }

        var url = `${API_BASE}/prices?codes=${codes.join(',')}&t=${Date.now()}`;
        console.log('Fetching prices for:', codes);
        var res = await fetch(url);
        if (!res.ok) throw new Error('HTTP error ' + res.status);
        
        var json = await res.json();
        if(json.ok && json.prices){
            var prices = getPrices();
            var updatedCount = Object.keys(json.prices).length;
            
            // Merge new prices
            Object.assign(prices, json.prices);
            localStorage.setItem(PKEY, JSON.stringify(prices));
            localStorage.setItem('price_update_time', json.time || new Date().toLocaleString('zh-TW'));
            
            render();
            btn.textContent = '✓ 更新 ' + updatedCount + ' 檔';
        } else {
            throw new Error(json.error || 'Price API returned no data');
        }
    } catch(e) {
        btn.textContent = '❌ 失敗';
        console.error('Fetch prices failed:', e);
        alert('股價更新失敗: ' + e.message);
    }
    setTimeout(() => { btn.textContent=orig; btn.disabled=false; }, 3000);
};

window.setPersonTab=function(p){
  activePerson=p;
  document.querySelectorAll('.ptab').forEach(b => b.classList.toggle('active', b.dataset.p===p));
  document.getElementById('f-person').value=p;
  curPage=1; render();
};

function render(){
  var topRows=activePerson ? data.filter(r => (r.person||'alex')===activePerson) : data;
  renderStats(topRows);
  renderSummary(topRows);
  
  var updateTime = localStorage.getItem('price_update_time');
  if(updateTime) document.getElementById('price-update-time').textContent = ' (股價更新於: ' + updateTime + ')';
  
  var filtered=applyFilters(data);
  
  var fSpend=0, fIncome=0;
  filtered.forEach(r => { fSpend+=Number(r.spend)||0; fIncome+=Number(r.income)||0; });
  var fNet = fIncome - fSpend;
  var fPctHtml = (fNet > 0 && fSpend > 0)
    ? ` <span class="pos" style="font-size:0.88em">(+${(fNet/fSpend*100).toFixed(2)}%)</span>`
    : '';

  document.getElementById('filter-count').innerHTML = `${filtered.length} 筆 | 損益 (收入-支出): <span class="${fNet>=0?'pos':'neg'}">${fmt(fNet)}</span>${fPctHtml}`;

  var foot=document.getElementById('tx-foot');
  if(foot) foot.innerHTML = `<tr style="background:var(--surface2);font-weight:700">
    <td colspan="8" style="text-align:right;color:var(--muted)">篩選小計 (損益 收入-支出: <span class="${fNet>=0?'pos':'neg'}">${fmt(fNet)}</span>${fPctHtml}):</td>
    <td class="num neg">${fmt(fSpend)}</td>
    <td class="num pos">${fmt(fIncome)}</td>
    <td colspan="3"></td>
  </tr>`;

  filtered=doSort(filtered);
  var total=filtered.length;
  var pages=Math.max(1, Math.ceil(total/perPage));
  if(curPage>pages)curPage=pages;
  renderTable(filtered.slice((curPage-1)*perPage, curPage*perPage));
  renderPagination(total,pages);
  renderDividendHistory();
}

function renderStats(rows){
  var totalSpend=0,totalIncome=0, prices=getPrices();
  rows.forEach(r => { totalSpend+=Number(r.spend)||0; totalIncome+=Number(r.income)||0; });
  
  var posMap={};
  rows.forEach(r => {
    var c = r.code ? r.code.toString().trim() : '';
    var key=c+'|'+(r.person||'alex');
    if(!posMap[key])posMap[key]={code:c,net:0};
    if(r.type==='買')posMap[key].net+=Number(r.buyShares)||0;
    else if(r.type==='賣')posMap[key].net-=Number(r.sellShares)||0;
  });
  var estMktVal=0,hasPx=false;
  Object.values(posMap).forEach(p => {
    var px=prices[p.code];
    if(px&&p.net>0){estMktVal+=p.net*px;hasPx=true;}
  });
  
  var net = totalIncome-totalSpend;
  var netTotal = hasPx ? (net + estMktVal) : null;

  var cards=[
    {label:'總筆數',val:rows.length,cls:''},
    {label:'總買入支出',val:'$'+fmt(totalSpend),cls:'neg'},
    {label:'總賣出收入',val:'$'+fmt(totalIncome),cls:'pos'},
    {label:'淨現金流',val:fmt(net),cls:net>=0?'pos':'neg'},
    {label:'估算市值',val:hasPx?'$'+fmt(estMktVal):'—',cls:''},
    {label:'含持股損益',val:netTotal!==null?fmt(netTotal):'—',cls:netTotal>=0?'pos':'neg'}
  ];
  document.getElementById('stats-grid').innerHTML=cards.map(c => `<div class="stat-card"><div class="stat-label">${c.label}</div><div class="stat-value ${c.cls}">${c.val}</div></div>`).join('');
}

function renderSummary(rows){
  var prices=getPrices(), map={};
  rows.forEach(r => {
    var c = r.code ? r.code.toString().trim() : '';
    var key=c+'|'+(r.person||'alex');
    if(!map[key])map[key]={code:c,name:r.name,person:r.person||'alex',buyShares:0,sellShares:0,totalSpend:0,totalIncome:0};
    var m=map[key];
    if(r.type==='買'){ m.buyShares+=Number(r.buyShares)||0; m.totalSpend+=Number(r.spend)||0; }
    else if(r.type==='賣'){ m.sellShares+=Number(r.sellShares)||0; m.totalIncome+=Number(r.income)||0; }
  });
  var html='';
  Object.values(map).sort((a,b)=>a.code.localeCompare(b.code)).forEach(m => {
    var netShares=m.buyShares-m.sellShares;
    if(netShares<=0)return;
    var avgBuy=m.totalSpend/m.buyShares;
    var todayPx=prices[m.code]||0;
    var estVal=netShares*todayPx;
    var plEstimate=m.totalIncome-m.totalSpend;
    var realPL=todayPx ? (estVal+plEstimate) : null;
    html+=`<tr>
      <td class="code"><a href="${googleFinanceUrl(m.code)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--accent)">${m.code}</a></td><td>${m.name}</td><td><span class="${m.person==='mark'?'person-mark':'person-alex'}">${m.person.toUpperCase()}</span></td>
      <td class="num">${fmtP(avgBuy)}</td><td class="num pos">${fmt(netShares)}</td><td class="num muted">${fmt(m.totalSpend)}</td><td class="num muted">${fmt(m.totalIncome)}</td>
      <td class="num"><input class="price-input" type="number" step="0.01" value="${todayPx||''}" onchange="savePrice('${m.code}',this.value)"></td>
      <td class="num est-val">${todayPx?fmt(estVal):'—'}</td><td class="num ${plEstimate>=0?'pos':'neg'}">${fmt(plEstimate)}</td>
      <td class="num ${realPL>=0?'pos':'neg'}">${realPL!==null?fmt(realPL):'—'}</td>
    </tr>`;
  });
  document.getElementById('summary-body').innerHTML=html;
}

function populateFilters(rows){
  var years=new Set(), codes=new Set(), names=new Set();
  rows.forEach(r => {
    if(r.date) {
        var f = formatDate(r.date);
        if(f && f !== '—') years.add(f.split('/')[0]);
    }
    if(r.code) codes.add(r.code);
    if(r.name) names.add(r.name);
  });
  const fill = (id, set) => {
    var el=document.getElementById(id);
    el.innerHTML = '<option value="">' + el.options[0].text + '</option>';
    Array.from(set).sort((a,b)=>b-a).forEach(v => { var o=document.createElement('option'); o.value=o.textContent=v; el.appendChild(o); });
  };
  fill('f-year', years); fill('f-code', codes); fill('f-name', names);
}

function applyFilters(rows){
  var p=document.getElementById('f-person').value, y=document.getElementById('f-year').value, 
      c=document.getElementById('f-code').value, n=document.getElementById('f-name').value,
      t=document.getElementById('f-type').value, s=document.getElementById('f-search').value.toLowerCase();
  return rows.filter(r => {
    if(p && (r.person||'alex')!==p) return false;
    if(y && formatDate(r.date).split('/')[0]!==y) return false;
    if(c && r.code!==c) return false;
    if(n && r.name!==n) return false;
    if(t && r.type!==t) return false;
    if(s && !(r.code.toLowerCase().includes(s)||r.name.toLowerCase().includes(s))) return false;
    return true;
  });
}

function resetFilters(){
  ['f-person','f-year','f-code','f-name','f-type'].forEach(id => document.getElementById(id).value='');
  document.getElementById('f-search').value=''; curPage=1; render();
}

function doSort(rows){
  return rows.slice().sort((a,b) => {
    var av, bv;
    if(sortCol==='date'){ av=formatDate(a.date); bv=formatDate(b.date); }
    else { av=(a[sortCol]||'').toString(); bv=(b[sortCol]||'').toString(); }
    if (av === bv) return 0;
    return sortDir==='asc' ? (av>bv?1:-1) : (av<bv?1:-1);
  });
}

function renderTable(rows){
  var prices=getPrices(), html='';
  rows.forEach(r => {
    var px=prices[r.code];
    var displayCost = r.cost;
    if (r.type === '賣' && r.amount && r.income) displayCost = r.amount - r.income;
    else if (r.type === '買' && r.spend && r.amount) displayCost = r.spend - r.amount;
    html+=`<tr class="${r.type==='買'?'row-buy':r.type==='賣'?'row-sell':''}">
      <td class="muted">${formatDate(r.date)}</td><td><span class="badge ${r.type==='買'?'badge-buy':r.type==='賣'?'badge-sell':'badge-div'}">${r.type}</span></td>
      <td class="code"><a href="${yahooUrl(r.code)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--accent)">${r.code}</a></td><td>${r.name}</td><td class="num">${fmt(r.type==='賣'?r.sellShares:r.buyShares)}</td>
      <td class="num">${fmtP(r.type==='賣'?r.sellPrice:r.buyPrice)}</td><td class="num">${fmt(r.amount)}</td><td class="num muted">${fmt(displayCost)}</td>
      <td class="num neg">${r.spend?fmt(r.spend):'—'}</td><td class="num pos">${r.income?fmt(r.income):'—'}</td>
      <td><span class="${r.person==='mark'?'person-mark':'person-alex'}">${(r.person||'alex').toUpperCase()}</span></td>
      <td class="muted">${r.note||''}</td>
      <td class="num">${px?fmtP(px):'—'}<button class="act-btn act-edit" onclick="showEditModal('${r._id}')">編輯</button><button class="act-btn act-del" onclick="confirmDel('${r._id}')">刪除</button></td>
    </tr>`;
  });
  document.getElementById('tx-body').innerHTML=html;
}

function renderPagination(total,pages){
  var html=`<span class="page-info">共 ${total} 筆，第 ${curPage}/${pages} 頁</span> `;
  if(curPage>1) html+=`<button class="page-btn" onclick="goPage(${curPage-1})">‹</button>`;
  for(var p=Math.max(1,curPage-2); p<=Math.min(pages,curPage+2); p++) 
    html+=`<button class="page-btn ${p===curPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  if(curPage<pages) html+=`<button class="page-btn" onclick="goPage(${curPage+1})">›</button>`;
  document.getElementById('pagination').innerHTML=html;
}
function goPage(p){ curPage=p; render(); }

function filterDivYear(y){
  document.getElementById('f-year').value = y;
  document.getElementById('f-type').value = '股利';
  document.getElementById('f-person').value = '';
  document.getElementById('f-code').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-search').value = '';
  activePerson = '';
  document.querySelectorAll('.ptab').forEach(b => b.classList.toggle('active', b.dataset.p===''));
  curPage = 1;
  render();
  document.querySelector('.section-title').scrollIntoView({behavior:'smooth', block:'start'});
}

function renderDividendHistory(){
  var divs = data.filter(r => r.type === '股利');
  var yearMap = {};
  divs.forEach(r => {
    var y = formatDate(r.date).split('/')[0];
    if(!y || y === '—') return;
    if(!yearMap[y]) yearMap[y] = { count:0, total:0 };
    yearMap[y].count++;
    yearMap[y].total += Number(r.income)||0;
  });
  var years = Object.keys(yearMap).sort((a,b) => Number(a)-Number(b));
  var grandTotal = years.reduce((s,y) => s + yearMap[y].total, 0);
  var grandCount = divs.length;
  var html = years.map(y => `<tr>
    <td><a href="#" onclick="filterDivYear('${y}');return false;" style="color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--accent)" title="點擊查看 ${y} 年股利明細">${y}</a></td>
    <td class="num pos">$${fmt(yearMap[y].total)}</td>
    <td class="num muted">${yearMap[y].count} 筆</td>
  </tr>`).join('');
  html += `<tr style="background:var(--surface2);font-weight:700">
    <td><a href="#" onclick="filterDivYear('');document.getElementById('f-type').value='股利';curPage=1;render();return false;" style="color:var(--accent);text-decoration:none" title="顯示全部年度股利">合計</a></td>
    <td class="num" style="color:var(--accent)">$${fmt(grandTotal)}</td>
    <td class="num muted">${grandCount} 筆</td>
  </tr>`;
  document.getElementById('div-history-body').innerHTML = html;
}

window.toggleEditMode=function(){
  if(editOn){ editOn=false; document.body.classList.remove('edit-on'); document.getElementById('edit-toolbar').classList.remove('on'); document.getElementById('edit-toggle').textContent='✏️ 編輯'; }
  else showPasswordModal(() => { editOn=true; document.body.classList.add('edit-on'); document.getElementById('edit-toolbar').classList.add('on'); document.getElementById('edit-toggle').textContent='✕ 退出編輯'; });
};

function showModal(html){ document.getElementById('crud-dialog').innerHTML=html; document.getElementById('crud-modal').classList.add('open'); }
window.hideModal=function(){ document.getElementById('crud-modal').classList.remove('open'); };

function showPasswordModal(onSuccess){
  showModal('<h3>🔒 請輸入密碼</h3><input type="password" id="pw-inp" style="width:100%;padding:8px;margin:10px 0"><div id="pw-err" class="err"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="hideModal()">取消</button><button class="btn btn-primary" id="pw-ok">確認</button></div>');
  const check=()=>{ if(document.getElementById('pw-inp').value==='0918216001'){hideModal();onSuccess();} else document.getElementById('pw-err').textContent='密碼錯誤'; };
  document.getElementById('pw-ok').onclick=check;
}

window.confirmDel=async function(id){
  showModal('<h3>⚠️ 確認刪除</h3><p>確定要刪除此筆記錄嗎？</p><div class="modal-actions"><button class="btn btn-secondary" onclick="hideModal()">取消</button><button class="btn btn-danger" id="del-yes">確定</button></div>');
  document.getElementById('del-yes').onclick=async ()=>{
    var res=await apiPost('/delete', {_id:id});
    if(res.ok){ hideModal(); fetchData(); }
  };
};

  r=r||{type:'買',person:'alex',date:new Date().toISOString().split('T')[0]};
  const v = f => r[f]!==undefined?r[f]:'';
  return `<h3>${title}</h3><div class="form-grid">
    <div class="form-group"><label>日期</label><input id="f-date" value="${formatDate(v('date'))}"></div>
    <div class="form-group"><label>類型</label><select id="f-type-s"><option ${v('type')==='買'?'selected':''}>買</option><option ${v('type')==='賣'?'selected':''}>賣</option></select></div>
    <div class="form-group"><label>代號</label><input id="f-code-i" value="${v('code')}"></div>
    <div class="form-group"><label>名稱</label><input id="f-name-i" value="${v('name')}"></div>
    <div class="form-group"><label>買入股數</label><input id="f-bs" type="number" value="${v('buyShares')}"></div>
    <div class="form-group"><label>買入價格</label><input id="f-bp" type="number" step="0.01" value="${v('buyPrice')}"></div>
    <div class="form-group"><label>賣出股數</label><input id="f-ss" type="number" value="${v('sellShares')}"></div>
    <div class="form-group"><label>賣出價格</label><input id="f-sp" type="number" step="0.01" value="${v('sellPrice')}"></div>
    <div class="form-group"><label>成交金額</label><input id="f-amt" type="number" value="${v('amount')}"></div>
    <div class="form-group"><label>支出</label><input id="f-spend" type="number" value="${v('spend')}"></div>
    <div class="form-group"><label>收入</label><input id="f-income" type="number" value="${v('income')}"></div>
    <div class="form-group"><label>人員</label><select id="f-person-s"><option ${v('person')==='alex'?'selected':''}>alex</option><option ${v('person')==='mark'?'selected':''}>mark</option></select></div>
  </div><div class="modal-actions"><button class="btn btn-secondary" onclick="hideModal()">取消</button><button class="btn btn-primary" id="form-save">儲存</button></div>`;
}

window.showAddModal=function(){
  showModal(rowFormHtml(null,'＋ 新增交易'));
  document.getElementById('form-save').onclick=async function(){
    var btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '儲存中...';

    var d={
      date:document.getElementById('f-date').value, type:document.getElementById('f-type-s').value,
      code:document.getElementById('f-code-i').value, name:document.getElementById('f-name-i').value,
      buyShares:Number(document.getElementById('f-bs').value), buyPrice:Number(document.getElementById('f-bp').value),
      sellShares:Number(document.getElementById('f-ss').value), sellPrice:Number(document.getElementById('f-sp').value),
      amount:Number(document.getElementById('f-amt').value), spend:Number(document.getElementById('f-spend').value),
      income:Number(document.getElementById('f-income').value), person:document.getElementById('f-person-s').value
    };
    try {
        var res=await apiPost('/add', d);
        if(res.ok){ hideModal(); fetchData(); }
        else { alert('儲存失敗'); btn.disabled = false; btn.textContent = '儲存'; }
    } catch(e) {
        alert('發生錯誤');
        btn.disabled = false;
        btn.textContent = '儲存';
    }
  };
};
