<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票交易記錄 2018–2026</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#263348;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--buy:#22c55e;--sell:#f87171;--div:#c084fc;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:1.2rem;font-weight:700;color:var(--accent)}
header span{color:var(--muted);font-size:0.82rem}
main{padding:18px 24px;max-width:1700px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px}
.stat-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:4px}
.stat-value{font-size:1.15rem;font-weight:700;color:var(--text)}
.pos{color:var(--buy)}.neg{color:var(--sell)}
.section-title{font-size:0.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th{background:var(--surface2);padding:9px 11px;text-align:left;font-size:0.73rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th.sort-asc::after{content:" ↑"}th.sort-desc::after{content:" ↓"}
td{padding:7px 11px;font-size:0.82rem;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.03)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.7rem;font-weight:700}
.badge-buy{background:rgba(34,197,94,0.15);color:var(--buy);border:1px solid rgba(34,197,94,0.3)}
.badge-sell{background:rgba(248,113,113,0.15);color:var(--sell);border:1px solid rgba(248,113,113,0.3)}
.badge-div{background:rgba(192,132,252,0.15);color:var(--div);border:1px solid rgba(192,132,252,0.3)}
.code{font-family:monospace;font-weight:700;font-size:0.78rem;color:var(--accent)}
.num{text-align:right}.muted{color:var(--muted)}
.person-mark{color:#fb923c;font-size:0.73rem;font-weight:700}
.person-alex{color:var(--accent);font-size:0.73rem;font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters select,.filters input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:0.8rem}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--accent)}
.btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:0.8rem;font-weight:600}
.btn-primary{background:var(--accent);color:#0f172a}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:#ef4444;color:#fff}
.pagination{display:flex;align-items:center;gap:6px;margin-top:10px;justify-content:flex-end;flex-wrap:wrap}
.page-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:0.78rem}
.page-btn.active{background:var(--accent);color:#0f172a;border-color:var(--accent)}
.page-info{font-size:0.78rem;color:var(--muted)}
#edit-toolbar{position:fixed;bottom:22px;right:22px;z-index:1000;display:flex;gap:8px;align-items:center}
#edit-toggle{padding:10px 18px;border-radius:25px;border:none;cursor:pointer;font-size:0.83rem;font-weight:700;background:#64748b;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,0.5);transition:background 0.2s}
#edit-toolbar.on #edit-toggle{background:var(--accent);color:#0f172a}
#add-btn{display:none;padding:10px 16px;border-radius:25px;border:none;cursor:pointer;font-size:0.83rem;font-weight:700;background:var(--buy);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,0.5)}
#edit-toolbar.on #add-btn{display:inline-block}
.act-btn{background:none;border:none;cursor:pointer;padding:3px 6px;border-radius:4px;font-size:0.72rem;display:none}
body.edit-on .act-btn{display:inline-block}
.act-edit{color:var(--accent)}.act-edit:hover{background:rgba(56,189,248,0.15)}
.act-del{color:var(--sell)}.act-del:hover{background:rgba(248,113,113,0.15)}
#crud-modal{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center}
#crud-modal.open{display:flex}
#crud-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.65)}
#crud-dialog{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:560px;max-width:96vw;max-height:92vh;overflow-y:auto}
#crud-dialog h3{font-size:1rem;font-weight:700;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:0.73rem;color:var(--muted);font-weight:600}
.form-group input,.form-group select,.form-group textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:0.82rem}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.err{color:var(--sell);font-size:0.78rem;margin-top:4px}
.summary-pos{color:var(--buy);font-weight:700}
.summary-neg{color:var(--sell);font-weight:700}
.price-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 7px;border-radius:5px;font-size:0.8rem;width:82px;text-align:right}
.price-input:focus{outline:none;border-color:var(--accent)}
.est-val{font-weight:700}
.person-tabs{display:flex;gap:8px;margin-bottom:16px}
.ptab{padding:7px 20px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:0.82rem;font-weight:600;transition:all 0.15s}
.ptab:hover{color:var(--text)}
.ptab.active[data-p=""]{background:var(--surface2);color:var(--text);border-color:var(--accent)}
.ptab.active[data-p="alex"]{background:rgba(56,189,248,0.15);color:var(--accent);border-color:var(--accent)}
.ptab.active[data-p="mark"]{background:rgba(251,146,60,0.15);color:#fb923c;border-color:#fb923c}
</style>
</head>
<body>
<header>
  <h1>📈 股票交易記錄</h1>
  <span id="hdr-sub">2018 – 2026</span>
</header>
<main>
  <div class="person-tabs">
    <button class="ptab active" data-p="" onclick="setPersonTab('')">👥 全部</button>
    <button class="ptab" data-p="alex" onclick="setPersonTab('alex')">Alex</button>
    <button class="ptab" data-p="mark" onclick="setPersonTab('mark')">Mark</button>
  </div>
  <div class="stats" id="stats-grid"></div>

  <div class="section-title">持股摘要（依代號 × 人員）</div>
  <div class="table-wrap">
    <table id="summary-table">
      <thead><tr>
        <th>代號</th><th>股票名稱</th><th>人員</th>
        <th class="num">買入均價</th><th class="num">現持股數</th>
        <th class="num">總買入支出</th><th class="num">已回收收入</th>
        <th class="num">損益估算</th>
        <th class="num">今日股價</th><th class="num">估算市值</th>
      </tr></thead>
      <tbody id="summary-body"></tbody>
    </table>
  </div>

  <div class="section-title">交易明細</div>
  <div class="filters">
    <select id="f-person"><option value="">全部人員</option><option value="alex">Alex</option><option value="mark">Mark</option></select>
    <select id="f-year"><option value="">全部年份</option></select>
    <select id="f-code"><option value="">全部代號</option></select>
    <select id="f-name"><option value="">全部名稱</option></select>
    <select id="f-type"><option value="">全部類型</option><option value="買">買入</option><option value="賣">賣出</option><option value="股利">股利</option></select>
    <input type="text" id="f-search" placeholder="搜尋名稱/代號…" style="width:160px">
    <button class="btn btn-secondary" onclick="resetFilters()">重置</button>
    <span id="filter-count" style="color:var(--muted);font-size:0.78rem;margin-left:auto"></span>
  </div>
  <div class="table-wrap">
    <table id="tx-table">
      <thead><tr>
        <th data-col="date">日期</th>
        <th data-col="type">類型</th>
        <th data-col="code">代號</th>
        <th data-col="name">名稱</th>
        <th data-col="shares" class="num">股數</th>
        <th data-col="price" class="num">成交價</th>
        <th data-col="amount" class="num">成交金額</th>
        <th data-col="cost" class="num">交易成本</th>
        <th data-col="spend" class="num">支出</th>
        <th data-col="income" class="num">收入</th>
        <th data-col="person">人員</th>
        <th data-col="note">備註</th>
        <th class="num" style="min-width:90px">今日股價</th>
      </tr></thead>
      <tbody id="tx-body"></tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>
</main>

<div id="edit-toolbar">
  <button id="edit-toggle" onclick="toggleEditMode()">✏️ 編輯</button>
  <button id="add-btn" onclick="showAddModal()">＋ 新增</button>
</div>

<div id="crud-modal">
  <div id="crud-backdrop"></div>
  <div id="crud-dialog"></div>
</div>

// ─── CRUD Store ───────────────────────────────────────────────────────────────
const SK='stock_crud_v1';
function getStore(){try{return JSON.parse(localStorage.getItem(SK)||'{"del":{},"edit":{},"add":[]}')}catch(e){return{del:{},edit:{},add:[]}}}
function saveStore(s){localStorage.setItem(SK,JSON.stringify(s))}

// ─── Build rows with overrides ────────────────────────────────────────────────
function buildRows(){
  var s=getStore(), rows=[];
  RAW.forEach(function(r,i){
    if(s.del['r'+i]) return;
    var row=s.edit['r'+i]||{
      _id:'r'+i, _src:'raw',
      date:r[0], type:r[1], code:r[2], name:r[3],
      buyShares:r[4], buyPrice:r[5], sellShares:r[6], sellPrice:r[7],
      fee:r[8], tax:r[9], amount:r[10], cost:r[11],
      spend:r[12], income:r[13], note:r[14], person:r[15]
    };
    row._id='r'+i;
    rows.push(row);
  });
  s.add.forEach(function(r){rows.push(r)});
  return rows;
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function fmt(n){if(!n&&n!==0)return'—';return Number(n).toLocaleString('en-US')}
function fmtP(n){if(!n&&n!==0)return'—';return Number(n).toFixed(2)}
function shares(r){return r.type==='賣'?r.sellShares:r.buyShares}
function price(r){return r.type==='賣'?r.sellPrice:r.buyPrice}
function dateSort(d){if(!d)return'0';var p=d.split('/');return p[0]+(p[1]||'0').padStart(2,'0')+(p[2]||'0').padStart(2,'0');}

// ─── State ────────────────────────────────────────────────────────────────────
var sortCol='date', sortDir='desc', curPage=1, perPage=50, editOn=false;

// ─── Price Store ──────────────────────────────────────────────────────────────
var PKEY='stock_prices';
function getPrices(){try{return JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){return{}}}
window.savePrice=function(code,val){var p=getPrices();p[code]=parseFloat(val)||0;localStorage.setItem(PKEY,JSON.stringify(p));render();};
var activePerson='';

// ─── Person Tab ───────────────────────────────────────────────────────────────
window.setPersonTab=function(p){
  activePerson=p;
  document.querySelectorAll('.ptab').forEach(function(b){b.classList.toggle('active',b.dataset.p===p);});
  document.getElementById('f-person').value=p;
  curPage=1; render();
};

// ─── Render All ───────────────────────────────────────────────────────────────
function render(){
  var all=buildRows();
  var topRows=activePerson?all.filter(function(r){return(r.person||'alex')===activePerson;}):all;
  renderStats(topRows);
  renderSummary(topRows);
  var filtered=applyFilters(all);
  document.getElementById('filter-count').textContent=filtered.length+'筆';
  filtered=doSort(filtered);
  var total=filtered.length;
  var pages=Math.max(1,Math.ceil(total/perPage));
  if(curPage>pages)curPage=pages;
  var start=(curPage-1)*perPage, end=Math.min(start+perPage,total);
  renderTable(filtered.slice(start,end));
  renderPagination(total,pages);
}

// ─── Stats ────────────────────────────────────────────────────────────────────
function renderStats(rows){
  var totalSpend=0,totalIncome=0,txCount=rows.length;
  rows.forEach(function(r){totalSpend+=Number(r.spend)||0;totalIncome+=Number(r.income)||0;});
  var net=totalIncome-totalSpend;
  var buyCount=rows.filter(function(r){return r.type==='買'}).length;
  var sellCount=rows.filter(function(r){return r.type==='賣'}).length;
  var g=document.getElementById('stats-grid');
  g.innerHTML=[
    {label:'總筆數',val:txCount,cls:''},
    {label:'買入次數',val:buyCount,cls:''},
    {label:'賣出次數',val:sellCount,cls:''},
    {label:'總買入支出',val:'$'+fmt(totalSpend),cls:'neg'},
    {label:'總賣出收入',val:'$'+fmt(totalIncome),cls:'pos'},
    {label:'淨現金流',val:(net>=0?'+':'')+fmt(net),cls:net>=0?'pos':'neg'}
  ].map(function(c){
    return '<div class="stat-card"><div class="stat-label">'+c.label+'</div><div class="stat-value '+c.cls+'">'+c.val+'</div></div>';
  }).join('');
}

// ─── Summary ──────────────────────────────────────────────────────────────────
function renderSummary(rows){
  var prices=getPrices();
  var map={};
  rows.forEach(function(r){
    var key=r.code+'|'+(r.person||'alex');
    if(!map[key])map[key]={code:r.code,name:r.name,person:r.person||'alex',buyShares:0,sellShares:0,totalSpend:0,totalIncome:0,buyAmt:0};
    var m=map[key];
    if(r.type==='買'){m.buyShares+=Number(r.buyShares)||0;m.totalSpend+=Number(r.spend)||0;m.buyAmt+=Number(r.amount)||0;}
    else if(r.type==='賣'){m.sellShares+=Number(r.sellShares)||0;m.totalIncome+=Number(r.income)||0;}
  });
  var keys=Object.keys(map).sort(function(a,b){
    return map[a].code.localeCompare(map[b].code)||map[a].person.localeCompare(map[b].person);
  });
  var html='';
  keys.forEach(function(k){
    var m=map[k];
    var netShares=m.buyShares-m.sellShares;
    if(netShares===0)return;
    var avgBuy=m.buyShares>0?(m.totalSpend/m.buyShares):0;
    var plEstimate=m.totalIncome-m.totalSpend;
    var plCls=plEstimate>=0?'summary-pos':'summary-neg';
    var personCls=m.person==='mark'?'person-mark':'person-alex';
    html+='<tr>';
    html+='<td class="code">'+m.code+'</td>';
    html+='<td>'+m.name+'</td>';
    html+='<td><span class="'+personCls+'">'+m.person.toUpperCase()+'</span></td>';
    html+='<td class="num">'+fmtP(avgBuy)+'</td>';
    html+='<td class="num"'+(netShares>0?' style="color:var(--buy)"':netShares===0?' style="color:var(--muted)"':' style="color:var(--sell)"')+'>'+fmt(netShares)+'</td>';
    html+='<td class="num muted">'+fmt(m.totalSpend)+'</td>';
    html+='<td class="num muted">'+fmt(m.totalIncome)+'</td>';
    html+='<td class="num '+plCls+'">'+(plEstimate>=0?'+':'')+fmt(plEstimate)+'</td>';
    var todayPx=prices[m.code]||0;
    var estVal=netShares*todayPx;
    html+='<td class="num"><input class="price-input" type="number" step="0.01" value="'+(todayPx||'')+'" placeholder="輸入" onchange="savePrice(\''+m.code+'\',this.value)"></td>';
    html+='<td class="num est-val '+(estVal>0?'pos':estVal<0?'neg':'muted')+'">'+(todayPx?fmt(estVal):'—')+'</td>';
    html+='</tr>';
  });
  document.getElementById('summary-body').innerHTML=html;
}

// ─── Filters ─────────────────────────────────────────────────────────────────
function populateFilters(rows){
  var years=new Set(), codeNameMap={};
  rows.forEach(function(r){
    if(r.date)years.add(r.date.split('/')[0]);
    if(r.code&&!codeNameMap[r.code])codeNameMap[r.code]=r.name||r.code;
  });
  var ysel=document.getElementById('f-year');
  var existing=Array.from(ysel.options).map(function(o){return o.value});
  Array.from(years).sort().reverse().forEach(function(y){
    if(!existing.includes(y)){var o=document.createElement('option');o.value=o.textContent=y;ysel.appendChild(o);}
  });
  var csel=document.getElementById('f-code');
  var existingC=Array.from(csel.options).map(function(o){return o.value});
  Object.keys(codeNameMap).sort().forEach(function(c){
    if(!existingC.includes(c)){var o=document.createElement('option');o.value=c;o.textContent=c+' '+codeNameMap[c];csel.appendChild(o);}
  });
  var nsel=document.getElementById('f-name');
  var existingN=Array.from(nsel.options).map(function(o){return o.value});
  var names=Array.from(new Set(Object.values(codeNameMap))).sort();
  names.forEach(function(n){
    if(!existingN.includes(n)){var o=document.createElement('option');o.value=o.textContent=n;nsel.appendChild(o);}
  });
}
function applyFilters(rows){
  var person=document.getElementById('f-person').value;
  var year=document.getElementById('f-year').value;
  var code=document.getElementById('f-code').value;
  var name=document.getElementById('f-name').value;
  var type=document.getElementById('f-type').value;
  var search=document.getElementById('f-search').value.trim().toLowerCase();
  return rows.filter(function(r){
    if(person&&(r.person||'alex')!==person)return false;
    if(year&&(!r.date||r.date.split('/')[0]!==year))return false;
    if(code&&r.code!==code)return false;
    if(name&&r.name!==name)return false;
    if(type&&r.type!==type)return false;
    if(search&&!(r.code.toLowerCase().includes(search)||r.name.toLowerCase().includes(search)))return false;
    return true;
  });
}
function resetFilters(){
  ['f-person','f-year','f-code','f-name','f-type'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-search').value='';
  curPage=1; render();
}

// ─── Sort ─────────────────────────────────────────────────────────────────────
function doSort(rows){
  return rows.slice().sort(function(a,b){
    var av,bv;
    if(sortCol==='date'){av=dateSort(a.date);bv=dateSort(b.date);}
    else if(sortCol==='amount'){av=Number(a.amount)||0;bv=Number(b.amount)||0;}
    else if(sortCol==='spend'){av=Number(a.spend)||0;bv=Number(b.spend)||0;}
    else if(sortCol==='income'){av=Number(a.income)||0;bv=Number(b.income)||0;}
    else if(sortCol==='shares'){av=shares(a);bv=shares(b);}
    else if(sortCol==='price'){av=price(a);bv=price(b);}
    else if(sortCol==='cost'){av=Number(a.cost)||0;bv=Number(b.cost)||0;}
    else{av=(a[sortCol]||'').toString();bv=(b[sortCol]||'').toString();}
    if(av<bv)return sortDir==='asc'?-1:1;
    if(av>bv)return sortDir==='asc'?1:-1;
    return 0;
  });
}

// ─── Table ────────────────────────────────────────────────────────────────────
function renderTable(rows){
  var prices=getPrices();
  var ths=document.querySelectorAll('#tx-table th[data-col]');
  ths.forEach(function(th){
    th.classList.remove('sort-asc','sort-desc');
    if(th.dataset.col===sortCol)th.classList.add('sort-'+sortDir);
  });
  var html='';
  rows.forEach(function(r){
    var badgeCls=r.type==='買'?'badge-buy':r.type==='賣'?'badge-sell':'badge-div';
    var pCls=r.person==='mark'?'person-mark':'person-alex';
    html+='<tr data-id="'+r._id+'">';
    html+='<td class="muted">'+r.date+'</td>';
    html+='<td><span class="badge '+badgeCls+'">'+r.type+'</span></td>';
    html+='<td class="code">'+r.code+'</td>';
    html+='<td>'+r.name+'</td>';
    html+='<td class="num">'+fmt(shares(r))+'</td>';
    html+='<td class="num">'+fmtP(price(r))+'</td>';
    html+='<td class="num">'+fmt(r.amount)+'</td>';
    html+='<td class="num muted">'+fmt(r.cost)+'</td>';
    html+='<td class="num'+(Number(r.spend)>0?' neg':'')+'">'+(Number(r.spend)>0?fmt(r.spend):'—')+'</td>';
    html+='<td class="num'+(Number(r.income)>0?' pos':'')+'">'+(Number(r.income)>0?fmt(r.income):'—')+'</td>';
    html+='<td><span class="'+pCls+'">'+(r.person||'alex').toUpperCase()+'</span></td>';
    html+='<td class="muted">'+( r.note||'' )+'</td>';
    var px=prices[r.code];
    html+='<td class="num" style="white-space:nowrap">'+(px?fmtP(px):'<span class="muted">—</span>')+'<button class="act-btn act-edit" style="margin-left:6px" onclick="showEditModal(\''+r._id+'\')">編輯</button><button class="act-btn act-del" onclick="confirmDel(\''+r._id+'\')">刪除</button></td>';
    html+='</tr>';
  });
  document.getElementById('tx-body').innerHTML=html;
}

// ─── Pagination ───────────────────────────────────────────────────────────────
function renderPagination(total,pages){
  var html='<span class="page-info">共 '+total+' 筆，第 '+curPage+'/'+pages+' 頁</span> ';
  if(curPage>1)html+='<button class="page-btn" onclick="goPage('+( curPage-1 )+')">‹</button>';
  var lo=Math.max(1,curPage-2), hi=Math.min(pages,curPage+2);
  for(var p=lo;p<=hi;p++){html+='<button class="page-btn'+(p===curPage?' active':'')+'" onclick="goPage('+p+')">'+p+'</button>';}
  if(curPage<pages)html+='<button class="page-btn" onclick="goPage('+( curPage+1 )+')">›</button>';
  document.getElementById('pagination').innerHTML=html;
}
function goPage(p){curPage=p;render();}

// ─── Edit Mode ────────────────────────────────────────────────────────────────
var editOn=false;
window.toggleEditMode=function(){
  if(editOn){exitEditMode();return;}
  showPasswordModal(function(){enterEditMode();});
};
function enterEditMode(){
  editOn=true;
  document.body.classList.add('edit-on');
  document.getElementById('edit-toolbar').classList.add('on');
  document.getElementById('edit-toggle').textContent='✕ 退出編輯';
}
function exitEditMode(){
  editOn=false;
  document.body.classList.remove('edit-on');
  document.getElementById('edit-toolbar').classList.remove('on');
  document.getElementById('edit-toggle').textContent='✏️ 編輯';
}

// ─── Modal Helpers ────────────────────────────────────────────────────────────
function showModal(html){
  document.getElementById('crud-dialog').innerHTML=html;
  document.getElementById('crud-modal').classList.add('open');
}
window.hideModal=function(){document.getElementById('crud-modal').classList.remove('open');};

// ─── Password ─────────────────────────────────────────────────────────────────
function showPasswordModal(onSuccess){
  showModal('<h3>🔒 請輸入密碼</h3><div class="form-group"><label>密碼</label><input type="password" id="pw-inp" placeholder="輸入密碼…"></div><div id="pw-err" class="err"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="hideModal()">取消</button><button class="btn btn-primary" id="pw-ok">確認</button></div>');
  var inp=document.getElementById('pw-inp');
  inp.focus();
  function check(){
    if(inp.value==='0918216001'){hideModal();onSuccess();}
    else{document.getElementById('pw-err').textContent='密碼錯誤，請重試';inp.value='';inp.focus();}
  }
  document.getElementById('pw-ok').addEventListener('click',check);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
}

// ─── Confirm Delete ───────────────────────────────────────────────────────────
window.confirmDel=function(id){
  showModal('<h3>⚠️ 確認刪除</h3><p style="color:var(--muted);margin-bottom:16px">確定要刪除這筆交易記錄嗎？</p><div class="modal-actions"><button class="btn btn-secondary" onclick="hideModal()">取消</button><button class="btn btn-danger" id="del-yes">確定刪除</button></div>');
  document.getElementById('del-yes').addEventListener('click',function(){
    var s=getStore();
    if(id.startsWith('r')){s.del[id]=1;}
    else{s.add=s.add.filter(function(r){return r._id!==id;});}
    saveStore(s);hideModal();render();
  });
};

// ─── Row Form HTML ────────────────────────────────────────────────────────────

  '<div class="form-group"><label>賣出股數</label><input id="f-ss" type="number" value="'+v('sellShares')+'"></div>'+
  '<div class="form-group"><label>賣出價格</label><input id="f-sp" type="number" step="0.01" value="'+v('sellPrice')+'"></div>'+
  '<div class="form-group"><label>手續費</label><input id="f-fee" type="number" value="'+v('fee')+'"></div>'+
  '<div class="form-group"><label>交易稅</label><input id="f-tax" type="number" value="'+v('tax')+'"></div>'+
  '<div class="form-group"><label>成交金額</label><input id="f-amt" type="number" value="'+v('amount')+'"></div>'+
  '<div class="form-group"><label>交易成本</label><input id="f-cost" type="number" value="'+v('cost')+'"></div>'+
  '<div class="form-group"><label>支出</label><input id="f-spend" type="number" value="'+v('spend')+'"></div>'+

function collectForm(){
  return{
    date:document.getElementById('f-date').value.trim(),
    type:document.getElementById('f-type-s').value,
    code:document.getElementById('f-code').value.trim(),
    name:document.getElementById('f-name').value.trim(),
    buyShares:Number(document.getElementById('f-bs').value)||0,
    buyPrice:Number(document.getElementById('f-bp').value)||0,
    sellShares:Number(document.getElementById('f-ss').value)||0,
    sellPrice:Number(document.getElementById('f-sp').value)||0,
    fee:Number(document.getElementById('f-fee').value)||0,
    tax:Number(document.getElementById('f-tax').value)||0,
    amount:Number(document.getElementById('f-amt').value)||0,
    cost:Number(document.getElementById('f-cost').value)||0,
    spend:Number(document.getElementById('f-spend').value)||0,
    income:Number(document.getElementById('f-income').value)||0,
    person:document.getElementById('f-person-s').value,
    note:document.getElementById('f-note').value.trim()
  };
}

// ─── Add ─────────────────────────────────────────────────────────────────────
window.showAddModal=function(){
  showModal(rowFormHtml(null,'＋ 新增交易'));
  document.getElementById('form-save').addEventListener('click',function(){
    var d=collectForm();
    if(!d.date||!d.code){document.getElementById('form-err').textContent='日期和代號為必填';return;}
    var s=getStore();
    d._id='a'+Date.now();d._src='added';
    s.add.push(d);saveStore(s);hideModal();render();
  });
};

// ─── Edit ─────────────────────────────────────────────────────────────────────
window.showEditModal=function(id){
  var all=buildRows();
  var row=null;all.forEach(function(r){if(r._id===id)row=r;});
  if(!row)return;
  showModal(rowFormHtml(row,'✏️ 修改交易'));
  document.getElementById('form-save').addEventListener('click',function(){
    var d=collectForm();
    if(!d.date||!d.code){document.getElementById('form-err').textContent='日期和代號為必填';return;}
    d._id=id;d._src=row._src;
    var s=getStore();
    if(id.startsWith('r')){s.edit[id]=d;}
    else{s.add=s.add.map(function(r){return r._id===id?d:r;});}
    saveStore(s);hideModal();render();
  });
};

// ─── Sort click ───────────────────────────────────────────────────────────────
document.getElementById('tx-table').querySelector('thead').addEventListener('click',function(e){
  var th=e.target.closest('th[data-col]');
  if(!th)return;
  var col=th.dataset.col;
  if(sortCol===col){sortDir=sortDir==='asc'?'desc':'asc';}else{sortCol=col;sortDir='desc';}
  curPage=1;render();
});

// ─── Filter change ────────────────────────────────────────────────────────────
document.getElementById('f-person').addEventListener('change',function(){
  activePerson=this.value;
  document.querySelectorAll('.ptab').forEach(function(b){b.classList.toggle('active',b.dataset.p===activePerson);});
  curPage=1; render();
});
['f-year','f-code','f-name','f-type'].forEach(function(id){
  document.getElementById(id).addEventListener('change',function(){curPage=1;render();});
});
document.getElementById('f-search').addEventListener('input',function(){curPage=1;render();});

document.getElementById('crud-backdrop').addEventListener('click',window.hideModal);

populateFilters(RAW.map(function(r,i){return{_id:'r'+i,date:r[0],type:r[1],code:r[2],name:r[3],person:r[15]};}));
render();
