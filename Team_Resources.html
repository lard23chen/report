<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團隊資源索引</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #273349;
            --border: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 30px 20px;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header-left { display: flex; align-items: center; gap: 16px; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .back-btn:hover { background: var(--surface2); color: var(--text); }
        h1 { font-size: 1.6rem; font-weight: 600; color: var(--text); }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--accent); }
        .search-box::placeholder { color: var(--text-dim); }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: var(--surface2); color: var(--text); }
        .btn-icon {
            padding: 5px 9px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .btn-edit { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .btn-edit:hover { background: rgba(59,130,246,0.3); }
        .btn-del { background: rgba(239,68,68,0.15); color: #f87171; }
        .btn-del:hover { background: rgba(239,68,68,0.3); }

        .table-wrap {
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--surface2); }
        th {
            padding: 12px 14px;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        th.col-num { width: 48px; text-align: center; }
        th.col-item { width: 22%; }
        th.col-url { width: 38%; }
        th.col-note { width: 22%; }
        th.col-ops { width: 90px; text-align: center; }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--surface2); }
        tbody tr.highlight { background: rgba(59,130,246,0.07); }

        td {
            padding: 10px 14px;
            font-size: 0.875rem;
            vertical-align: middle;
        }
        td.col-num {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 600;
        }
        td.col-item { font-weight: 500; color: var(--text); }
        td.col-url a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.82rem;
            display: block;
            max-width: 380px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        td.col-url a:hover { text-decoration: underline; }
        td.col-url .no-url { color: var(--text-dim); font-size: 0.8rem; font-style: italic; }
        td.col-url .raw-text { color: #f59e0b; font-size: 0.8rem; }
        td.col-note { color: var(--text-muted); font-size: 0.82rem; }
        td.col-ops { text-align: center; white-space: nowrap; }
        td.col-ops .btn-icon + .btn-icon { margin-left: 4px; }

        .count-badge {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal h2 { font-size: 1.1rem; margin-bottom: 20px; color: var(--text); }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 12px;
            color: var(--text);
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
        .form-group textarea { resize: vertical; min-height: 70px; }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* Confirm dialog */
        .confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .confirm-overlay.open { display: flex; }
        .confirm-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .confirm-box .icon { font-size: 2rem; margin-bottom: 12px; }
        .confirm-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
        .confirm-box strong { color: var(--text); }
        .confirm-footer { display: flex; justify-content: center; gap: 10px; }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        @media (max-width: 700px) {
            th.col-url, td.col-url { display: none; }
            th.col-note, td.col-note { display: none; }
        }
    </style>
</head>
<body>

<div class="page-header">
    <div class="page-header-left">
        <a href="Category_Index.html" class="back-btn">← 返回索引</a>
        <div>
            <h1>📋 團隊資源索引</h1>
            <div class="subtitle">數位應用開發 Team — 常用連結管理</div>
        </div>
    </div>
</div>

<div class="toolbar">
    <input type="text" class="search-box" id="searchBox" placeholder="搜尋項目、網址、備註…" oninput="renderTable()">
    <span class="count-badge" id="countBadge"></span>
    <button class="btn btn-primary" onclick="openAddModal()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        新增項目
    </button>
    <button class="btn btn-ghost" onclick="resetData()" title="還原為原始資料">↺ 還原</button>
</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th class="col-num">#</th>
                <th class="col-item">項目</th>
                <th class="col-url">網址</th>
                <th class="col-note">備註</th>
                <th class="col-ops">操作</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="footer" id="footerText"></div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">新增項目</h2>
        <div class="form-group">
            <label>項目名稱 <span style="color:var(--danger)">*</span></label>
            <input type="text" id="fItem" placeholder="輸入項目名稱">
        </div>
        <div class="form-group">
            <label>網址</label>
            <input type="text" id="fUrl" placeholder="https://…">
        </div>
        <div class="form-group">
            <label>備註</label>
            <textarea id="fNote" placeholder="選填備註說明"></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveModal()">儲存</button>
        </div>
    </div>
</div>

<!-- Confirm Delete Dialog -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <div class="icon">🗑️</div>
        <p>確定要刪除 <strong id="confirmItemName"></strong>？</p>
        <div class="confirm-footer">
            <button class="btn btn-ghost" onclick="closeConfirm()">取消</button>
            <button class="btn btn-danger" onclick="confirmDelete()">刪除</button>
        </div>
    </div>
</div>

    { item: "會員社群平台", url: "https://docs.google.com/spreadsheets/d/13f9yVUD3kVon1J1hE0zjA6lsG8I_w5ibQrh_51xg-wQ/edit?usp=sharing", note: "" },

    { item: "每月統計資料", url: "每月統計資料 - Google 試算表", note: "" },
    { item: "GA4流量統計表", url: "流量統計表 - Google 試算表", note: "" },

    { item: "資料維護計畫表", url: "數位應用開發team_資料維護計畫 - Google 試算表", note: "" },
    { item: "週報", url: "https://docs.google.com/spreadsheets/d/17ayOPi1cnl8RJ7ihIIlfhSNPhOnbtFNsCYhwmNl7qjY/edit#gid=1140229310", note: "" },
    { item: "雲端總表", url: "數位應用開發TEAM雲端總表 - Google 試算表", note: "" },

    { item: "業務回覆項目", url: "https://docs.google.com/spreadsheets/d/1dBGSUPKCzAkN6bzy1p6VwOGjDon_L8hyap_jdaP06vU/edit#gid=0", note: "" },

    { item: "每日障礙", url: "https://docs.google.com/spreadsheets/d/1yoB9MQOV4272AHdxxjyEZm9kYHOUryccU2al_SuX4Yw/edit?gid=351538055#gid=351538055", note: "" },

    { item: "A系統壓力測試", url: "https://docs.google.com/spreadsheets/d/1IyWrbU0UB0CsQ79sKO-FNYAtHA2aQWQxfIOyA8cOrh0/edit?gid=86918631#gid=86918631", note: "" },
    { item: "教育訓練", url: "https://docs.google.com/spreadsheets/d/17ayOPi1cnl8RJ7ihIIlfhSNPhOnbtFNsCYhwmNl7qjY/edit?gid=717052423#gid=717052423", note: "" },
    { item: "居家上班", url: "https://docs.google.com/spreadsheets/d/1CxovuBKF7xTQev7VO_nXTjJDUemeYYluwTjX6VGwpxQ/edit?gid=309715445#gid=309715445", note: "" },
    { item: "CHATGPT", url: "https://docs.google.com/spreadsheets/d/1EFz8srB8cCcWDAkjsr4OcKYngyKxF7VeA9HrZ3SfxG0/edit?gid=0#gid=0", note: "" },
    { item: "每月雲端成本", url: "https://docs.google.com/presentation/d/1gse1Zjb-RpCaLzOtLTBlgwa354wgKNvXWQtwDWr1x_8/edit?slide=id.g3bb5b6d94a9_2_105", note: "" },
    { item: "cloudflare", url: "https://docs.google.com/spreadsheets/d/1qcga2w1pWhezCeGQ47JSXRVGnz-Yb7UyOB9-s1e1b_c/edit?gid=0#gid=0", note: "" },
    { item: "CF簡報", url: "https://docs.google.com/presentation/d/1UOIPe--oACXl-zWczYK08qQLcrSW2Q_AkSGzSugC0zs/edit?slide=id.g3c4ceb50076_0_0", note: "" },
];

let data = [];
let editIdx = null;
let deleteIdx = null;

function load() {
    const saved = localStorage.getItem(STORAGE_KEY);
    data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(initialData));
}
function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function resetData() {
    if (!confirm('確定要還原為原始資料？所有修改將會遺失。')) return;
    localStorage.removeItem(STORAGE_KEY);
    load();
    renderTable();
}

function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function isUrl(s) {
    return /^https?:\/\//i.test((s || '').trim());
}
function shortUrl(s) {
    try {
        const u = new URL(s);
        return (u.hostname + u.pathname).replace(/\/$/, '').substring(0, 55) + (s.length > 60 ? '…' : '');
    } catch { return s.substring(0, 55) + (s.length > 60 ? '…' : ''); }
}

function renderTable() {
    const q = (document.getElementById('searchBox').value || '').toLowerCase();
    const body = document.getElementById('tableBody');
    let rows = '';
    let shown = 0;

    data.forEach((row, i) => {
        const matchItem = row.item.toLowerCase().includes(q);
        const matchUrl  = (row.url || '').toLowerCase().includes(q);
        const matchNote = (row.note || '').toLowerCase().includes(q);
        if (q && !matchItem && !matchUrl && !matchNote) return;
        shown++;
        const urlCell = isUrl(row.url)
            ? `<a href="${esc(row.url)}" target="_blank" title="${esc(row.url)}">${esc(shortUrl(row.url))}</a>`
            : (row.url ? `<span class="raw-text" title="非網址格式，請點編輯補上正確連結">⚠ ${esc(row.url)}</span>` : `<span class="no-url">—</span>`);
        rows += `<tr>
            <td class="col-num">${i + 1}</td>
            <td class="col-item">${esc(row.item)}</td>
            <td class="col-url">${urlCell}</td>
            <td class="col-note">${esc(row.note) || ''}</td>
            <td class="col-ops">
                <button class="btn-icon btn-edit" onclick="openEditModal(${i})" title="編輯">✏️</button>
                <button class="btn-icon btn-del" onclick="openConfirm(${i})" title="刪除">🗑️</button>
            </td>
        </tr>`;
    });

    body.innerHTML = rows || `<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text-dim);">找不到符合的項目</td></tr>`;
    document.getElementById('countBadge').textContent = q ? `${shown} / ${data.length} 筆` : `共 ${data.length} 筆`;
    document.getElementById('footerText').textContent = `最後更新：${new Date().toLocaleString('zh-TW', {hour12:false})}`;
}

// Modal
function openAddModal() {
    editIdx = null;
    document.getElementById('modalTitle').textContent = '新增項目';
    document.getElementById('fItem').value = '';
    document.getElementById('fUrl').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('fItem').focus(), 50);
}
function openEditModal(i) {
    editIdx = i;
    const row = data[i];
    document.getElementById('modalTitle').textContent = '編輯項目';
    document.getElementById('fItem').value = row.item;
    document.getElementById('fUrl').value = row.url || '';
    document.getElementById('fNote').value = row.note || '';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('fItem').focus(), 50);
}
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
}
function saveModal() {
    const item = document.getElementById('fItem').value.trim();
    if (!item) { document.getElementById('fItem').focus(); return; }
    const url  = document.getElementById('fUrl').value.trim();
    const note = document.getElementById('fNote').value.trim();
    if (editIdx === null) {
        data.push({ item, url, note });
    } else {
        data[editIdx] = { item, url, note };
    }
    save();
    closeModal();
    renderTable();
}

// Confirm delete
function openConfirm(i) {
    deleteIdx = i;
    document.getElementById('confirmItemName').textContent = data[i].item;
    document.getElementById('confirmOverlay').classList.add('open');
}
function closeConfirm() {
    document.getElementById('confirmOverlay').classList.remove('open');
    deleteIdx = null;
}
function confirmDelete() {
    if (deleteIdx !== null) {
        data.splice(deleteIdx, 1);
        save();
        renderTable();
    }
    closeConfirm();
}

// Keyboard
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeConfirm(); }
    if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) {
        if (document.activeElement.tagName !== 'TEXTAREA') saveModal();
    }
});
document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
});

load();
renderTable();
</script>
</body>
</html>
