<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團隊資源索引</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #273349;
            --border: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 30px 20px;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header-left { display: flex; align-items: center; gap: 16px; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .back-btn:hover { background: var(--surface2); color: var(--text); }
        h1 { font-size: 1.6rem; font-weight: 600; color: var(--text); }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--accent); }
        .search-box::placeholder { color: var(--text-dim); }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
            text-decoration: none;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: var(--surface2); color: var(--text); }

        .count-badge {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .table-wrap {
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--surface2); }
        th {
            padding: 12px 14px;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        th.col-num { width: 48px; text-align: center; }
        th.col-item { width: 25%; }
        th.col-url { }
        th.col-note { width: 22%; }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--surface2); }

        td {
            padding: 10px 14px;
            font-size: 0.875rem;
            vertical-align: middle;
        }
        td.col-num {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 600;
        }
        td.col-item { font-weight: 500; color: var(--text); }
        td.col-url a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.82rem;
            display: block;
            max-width: 420px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        td.col-url a:hover { text-decoration: underline; }
        td.col-url .no-url { color: var(--text-dim); font-size: 0.8rem; font-style: italic; }
        td.col-url .raw-text { color: #f59e0b; font-size: 0.8rem; }
        td.col-note { color: var(--text-muted); font-size: 0.82rem; }

        /* Loading / Error */
        .status-row td {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .sync-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            color: var(--text-dim);
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; }
        .dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
        .dot.error { background: var(--danger); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .footer { margin-top: 24px; text-align: center; font-size: 0.8rem; color: var(--text-dim); }

        @media (max-width: 700px) {
            th.col-note, td.col-note { display: none; }
        }
    </style>
</head>
<body>

<div class="page-header">
    <div class="page-header-left">
        <a href="Category_Index.html" class="back-btn">← 返回索引</a>
        <div>
            <h1>📋 團隊資源索引</h1>
            <div class="subtitle">數位應用開發 Team — 常用連結管理</div>
        </div>
    </div>
    <div class="sync-info">
        <span class="dot loading" id="syncDot"></span>
        <span id="syncText">載入中…</span>
    </div>
</div>

<div class="toolbar">
    <input type="text" class="search-box" id="searchBox" placeholder="搜尋項目、網址、備註…" oninput="renderTable()" disabled>
    <span class="count-badge" id="countBadge">—</span>
    <a href="https://docs.google.com/spreadsheets/d/1HbHSaa1EL4zv6JHFOFDTr8pdBJA_QA7Q2E_pQTbWl_0/edit" target="_blank" class="btn btn-primary">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        在 Google Sheet 編輯
    </a>
    <button class="btn btn-ghost" onclick="fetchData()" id="reloadBtn">↺ 重新整理</button>
</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th class="col-num">#</th>
                <th class="col-item">項目</th>
                <th class="col-url">網址</th>
                <th class="col-note">備註</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr class="status-row"><td colspan="4"><span class="spinner"></span>從 Google Sheet 載入資料中…</td></tr>
        </tbody>
    </table>
</div>

<div class="footer" id="footerText"></div>

<script>
const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/1HbHSaa1EL4zv6JHFOFDTr8pdBJA_QA7Q2E_pQTbWl_0/export?format=csv&gid=0';
let data = [];

function parseCSV(text) {
    const rows = [];
    let i = 0;
    while (i < text.length) {
        const row = [];
        while (i < text.length && text[i] !== '\n') {
            if (text[i] === '"') {
                i++;
                let cell = '';
                while (i < text.length) {
                    if (text[i] === '"' && text[i+1] === '"') { cell += '"'; i += 2; }
                    else if (text[i] === '"') { i++; break; }
                    else { cell += text[i++]; }
                }
                row.push(cell.replace(/\r/g, '').trim());
                if (text[i] === ',') i++;
            } else {
                let cell = '';
                while (i < text.length && text[i] !== ',' && text[i] !== '\n') cell += text[i++];
                row.push(cell.replace(/\r/g, '').trim());
                if (text[i] === ',') i++;
            }
        }
        if (text[i] === '\n') i++;
        if (row.length > 0 && row.some(c => c)) rows.push(row);
    }
    return rows;
}

function isUrl(s) { return /^https?:\/\//i.test((s || '').trim()); }
function shortUrl(s) {
    try {
        const u = new URL(s);
        const p = (u.hostname + u.pathname).replace(/\/$/, '');
        return p.length > 55 ? p.substring(0, 55) + '…' : p;
    } catch { return s.length > 55 ? s.substring(0, 55) + '…' : s; }
}
function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function fetchData() {
    setSyncState('loading', '載入中…');
    document.getElementById('reloadBtn').disabled = true;
    document.getElementById('searchBox').disabled = true;
    document.getElementById('tableBody').innerHTML =
        '<tr class="status-row"><td colspan="4"><span class="spinner"></span>從 Google Sheet 載入資料中…</td></tr>';

    try {
        const res = await fetch(SHEET_CSV + '&t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const rows = parseCSV(text);
        if (rows.length < 2) throw new Error('資料格式錯誤');
        // Skip header row
        data = rows.slice(1).map(r => ({
            item: r[0] || '',
            url:  r[1] || '',
            note: r[2] || ''
        })).filter(r => r.item);

        setSyncState('ok', `同步自 Google Sheet・${new Date().toLocaleTimeString('zh-TW', {hour12:false})}`);
        document.getElementById('searchBox').disabled = false;
        renderTable();
    } catch (e) {
        setSyncState('error', '載入失敗：' + e.message);
        document.getElementById('tableBody').innerHTML =
            '<tr class="status-row"><td colspan="4" style="color:var(--danger)">⚠ 無法載入資料，請確認 Google Sheet 已公開，或按重新整理再試。</td></tr>';
    }
    document.getElementById('reloadBtn').disabled = false;
}

function setSyncState(state, text) {
    const dot = document.getElementById('syncDot');
    dot.className = 'dot' + (state === 'loading' ? ' loading' : state === 'error' ? ' error' : '');
    document.getElementById('syncText').textContent = text;
}

function renderTable() {
    const q = (document.getElementById('searchBox').value || '').toLowerCase();
    const body = document.getElementById('tableBody');
    let rows = '', shown = 0;

    data.forEach((row, i) => {
        if (q && !row.item.toLowerCase().includes(q) &&
                 !row.url.toLowerCase().includes(q) &&
                 !(row.note||'').toLowerCase().includes(q)) return;
        shown++;
        const urlCell = isUrl(row.url)
            ? `<a href="${esc(row.url)}" target="_blank" title="${esc(row.url)}">${esc(shortUrl(row.url))}</a>`
            : (row.url ? `<span class="raw-text" title="${esc(row.url)}">⚠ ${esc(row.url.substring(0,50))}</span>`
                       : `<span class="no-url">—</span>`);
        rows += `<tr>
            <td class="col-num">${i + 1}</td>
            <td class="col-item">${esc(row.item)}</td>
            <td class="col-url">${urlCell}</td>
            <td class="col-note">${esc(row.note)}</td>
        </tr>`;
    });

    body.innerHTML = rows || '<tr class="status-row"><td colspan="4">找不到符合的項目</td></tr>';
    document.getElementById('countBadge').textContent = q ? `${shown} / ${data.length} 筆` : `共 ${data.length} 筆`;
    document.getElementById('footerText').textContent = `資料來源：Google Sheet（每次開啟自動同步）`;
}

fetchData();
</script>
</body>
</html>
