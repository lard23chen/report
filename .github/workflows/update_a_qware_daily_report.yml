name: Auto Update A_Qware Daily Report

on:
  schedule:
    # 09:00 AM Taipei Time (UTC+8) = 01:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Generate Daily Report
      run: node generate_a_daily_report.js

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # Check if there are changes
        if [[ -n $(git status -s) ]]; then
          git add A_Qware_Revenue_Report_Daily.html
          git commit -m "Auto-update A_Qware Daily report: $(date)"
          git push
        else
          echo "No changes to commit"
        fi
